[project]
name = "phrydy"
version = "4.1.0"
description = "Extended version of the mediafile library of the beets project. It is used by the Python command line tool `audiorename`."
authors = [{ name = "Josef Friedrich", email = "josef@friedrich.rocks" }]
requires-python = ">=3.9,<4"
readme = "README.rst"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Utilities",
]
dependencies = [
    "typing-extensions>=4,<5",
    "termcolor>=2.5,<3",
    "filetype>=1.2.0,<2",
    "mutagen>=1.47,<2",
]

[project.urls]
Repository = "https://github.com/Josef-Friedrich/phrydy"

[project.scripts]
phrydy-debug = "phrydy.debug:init_cli"

[dependency-groups]
dev = [
    "readme-patcher>=0,<1",
    "stdout-stderr-capturing>=0,<1",
    "ruff>=0,<1",
    "pytest>=8,<9",
    "mypy>=1,<2",
]

[build-system]
requires = ["uv_build>=0.8.10,<0.9.0"]
build-backend = "uv_build"
